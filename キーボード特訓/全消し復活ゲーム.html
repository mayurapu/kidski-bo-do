<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>【修行】削り取って直すッ！ショートカット修行</title>
  <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #1a0026;
      font-family: "UD Digi Kyokasho N-R", "Kosugi Maru", sans-serif;
      margin: 20px;
      text-align: center;
      color: #e0b0ff;
      overflow-x: hidden;
      transition: background-color 0.3s;
    }
    /* 警告状態の背景（ガオン！な感じ） */
    body.danger-alert { background-color: #4b0082; }

    h1 {
      color: #cc33ff;
      font-size: 28px;
      text-shadow: 3px 3px 0px #000;
      border-bottom: 4px solid #cc33ff;
      display: inline-block;
      margin-bottom: 10px;
    }

    .info-box {
      background: rgba(0, 0, 0, 0.5);
      border: 3px solid #cc33ff;
      border-radius: 20px;
      padding: 10px;
      margin: 0 auto 10px;
      max-width: 600px;
      box-shadow: 0 0 15px #cc33ff;
    }

    .mission-area {
      font-size: 26px;
      font-weight: bold;
      height: 70px;
      margin-top: 10px;
      color: #fff;
    }

    #target-container {
      background: #000;
      color: #fff;
      padding: 20px;
      border-radius: 15px;
      font-size: 45px;
      margin: 10px auto;
      max-width: 500px;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 8px double #cc33ff;
      box-shadow: inset 0 0 20px #cc33ff;
    }

    .input-zone {
      margin: 20px auto;
      width: 550px;
      position: relative;
    }

    .command-label {
      background: #ffff00;
      color: #000;
      font-weight: bold;
      font-size: 22px;
      padding: 8px 20px;
      border-radius: 10px 10px 0 0;
      display: inline-block;
      box-shadow: 0 -3px 10px rgba(0,0,0,0.5);
      border: 2px solid #000;
    }

    input#magic-input {
      font-size: 32px;
      padding: 20px;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      border-radius: 0 0 15px 15px;
      border: 6px solid #ffff00;
      background: #eee;
      color: #000;
      outline: none;
    }

    #result-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 100;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .result-card {
      background: white;
      color: #333;
      padding: 40px;
      border-radius: 30px;
      border: 10px solid #cc33ff;
      text-align: center;
    }

    .result-score { font-size: 80px; color: #cc33ff; margin: 20px 0; display: block; font-weight: 900; }
  </style>
</head>
<body onload="initGame()">

  <h1>💜 修練：削り取って直すッ！ショートカット修行 💜</h1>

  <div class="info-box">
    <div style="font-size: 22px; font-weight: bold;">
      残り：<span id="timer">60</span>秒　
      守った数：<span id="score">0</span>
    </div>
  </div>

  <div class="mission-area" id="mission-text">削るッ！</div>

  <div id="target-container"><span id="display-text">---</span></div>

  <div class="input-zone">
    <div id="current-command" class="command-label">わくをクリック！</div>
    <input type="text" id="magic-input" oninput="checkAction()" autocomplete="off">
    
    <div id="reset-hint" style="margin-top:10px; color:#ffff00; font-weight:bold; display:none;">
      ⚠️ 直せない！【Enter】でつぎへッ！
    </div>
  </div>

  <p style="color:#cc33ff; font-weight: bold;">※ 1文字ずつ消すなんて『無駄』なんだ…無駄無駄……</p>

  <div id="result-overlay">
    <div class="result-card">
      <h2 style="font-size: 32px;">🎉 修行終了 🎉</h2>
      <p style="font-size: 20px;">君が「直し」きった数は...</p>
      <span class="result-score" id="final-score">0</span>
      <p style="font-size: 18px;">画面を更新(F5)してもう一回！</p>
    </div>
  </div>

  <script>
    let score = 0;
    let timeLeft = 60;
    let isPlaying = false;
    let timerID;
    let phase = 1; 
    let currentItem = "";

    const PROTECT_ITEMS = ["👽宇宙人", "👶 赤ちゃん", "🐶 かわいい子犬", "🥪サンドイッチ", "👛さいふ", "🐢カメ"];
    const missionText = document.getElementById("mission-text");
    const displayText = document.getElementById("display-text");
    const magicInput = document.getElementById("magic-input");
    const commandLabel = document.getElementById("current-command");
    const resetHint = document.getElementById("reset-hint");

    function initGame() {
      score = 0; timeLeft = 60; isPlaying = false;
      document.getElementById("score").textContent = score;
      document.getElementById("timer").textContent = timeLeft;
      nextMission();
    }

    function nextMission() {
      phase = 1;
      resetHint.style.display = "none";
      currentItem = PROTECT_ITEMS[Math.floor(Math.random() * PROTECT_ITEMS.length)];
      displayText.textContent = currentItem;
      magicInput.value = currentItem;
      
      document.body.classList.add("danger-alert");
      missionText.innerHTML = "<span style='animation: blink 0.5s infinite; color:#ffff00;'>ガオン！✋空間を削り取れッ！</span>";
      commandLabel.innerHTML = "Ctrl + A → Backspace";
      commandLabel.style.background = "#ffff00";
      magicInput.focus();
    }

    function checkAction() {
      if (!isPlaying) startTimer();

      if (phase === 1) {
        // 押しミスフォロー
        if (magicInput.value.length > currentItem.length) {
            magicInput.select();
            commandLabel.innerHTML = "そのまま Backspace で削り取れッ！";
            return;
        }

        if (magicInput.value === "") {
          phase = 2;
          document.body.classList.remove("danger-alert");
          missionText.innerHTML = "<span style='color:#55efc4'>『ダイヤモンド』は砕けない！今のを直すッ！</span>";
          commandLabel.innerHTML = "Ctrl + Z";
          commandLabel.style.background = "#55efc4";
          displayText.textContent = "（削り取られた...！）";
          // 3.5秒で直せない場合のヒント
          setTimeout(() => { if(phase === 2) resetHint.style.display = "block"; }, 3500);
        }
      } 
      else if (phase === 2 && magicInput.value === currentItem) {
        success();
      }
    }

    window.onkeydown = function(e) {
      if (e.keyCode === 13 && phase === 2) nextMission();
    };

    function success() {
  score++;
  document.getElementById("score").textContent = score;
  
  // ランダムでジョジョっぽい褒め言葉が出るようにする
  const compliments = ["グレートですよこいつはァ", "ディ・モールト（非常に）良し！", "「覚悟」ができてるなッ！", "「運」が向いてきやがったぜ"];
  const msg = compliments[Math.floor(Math.random() * compliments.length)];
  
  displayText.textContent = "✨ 守りきったッ！ ✨";
  commandLabel.innerHTML = msg; 
  commandLabel.style.background = "#fff";
  phase = 0;
  setTimeout(nextMission, 800);
}

    function startTimer() {
      isPlaying = true;
      timerID = setInterval(() => {
        timeLeft--;
        document.getElementById("timer").textContent = timeLeft;
        if (timeLeft <= 0) endGame();
      }, 1000);
    }

    function endGame() {
      clearInterval(timerID);
      magicInput.readOnly = true;
      document.body.classList.remove("danger-alert");
      document.getElementById("final-score").textContent = score;
      document.getElementById("result-overlay").style.display = "flex";
    }
  </script>

  <style>
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  </style>
</body>
</html>
