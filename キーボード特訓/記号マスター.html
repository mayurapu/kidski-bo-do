<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>【練習】きごうをうとう！</title>
  <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #f3e5f5;
      font-family: "UD Digi Kyokasho N-R", "Kosugi Maru", sans-serif;
      margin: 20px;
      text-align: center;
      color: #333;
    }

    h1 {
      color: #6a1b9a;
      font-size: 24px;
      border-bottom: 3px solid #6a1b9a;
      display: inline-block;
      padding-bottom: 5px;
    }

    .info-box {
      background: white;
      border: 3px solid #ba68c8;
      border-radius: 15px;
      padding: 15px;
      margin: 10px auto;
      max-width: 700px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .score-area {
      font-size: 18px;
      font-weight: bold;
      color: #8e24aa;
      margin-bottom: 10px;
    }

    .warning-hint {
      background-color: #fff9c4;
      padding: 10px;
      border-radius: 10px;
      border: 2px dashed #fbc02d;
      margin-bottom: 15px;
      font-weight: bold;
      color: #7f6e00;
      line-height: 1.6;
    }

    #question-display {
      font-size: 80px; 
      font-weight: bold;
      margin: 20px 0;
      color: #333;
      min-height: 100px;
      background: white;
      display: inline-block;
      padding: 10px 50px;
      border-radius: 20px;
    }

    #input-area {
      font-size: 40px;
      padding: 10px;
      border: 4px solid #ba68c8;
      border-radius: 10px;
      width: 250px;
      text-align: center;
      outline: none;
    }

    #quote-display {
      margin-top: 15px;
      padding: 15px;
      background: #e1f5fe;
      border-radius: 10px;
      border-left: 10px solid #03a9f4;
      display: none; 
      text-align: left;
      font-size: 19px;
      animation: bounce 0.5s;
    }

    @keyframes bounce {
      0% { transform: scale(0.8); }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .guide {
      margin-top: 30px;
      background: #ede7f6;
      padding: 20px;
      border-radius: 15px;
      display: inline-block;
      border: 1px solid #b39ddb;
      max-width: 600px;
    }

    .key-cap {
      background: #fff;
      border: 2px solid #666;
      border-radius: 5px;
      padding: 2px 8px;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 2px 0 #666;
    }

    .success {
      background-color: #c8e6c9 !important;
      border-color: #4caf50 !important;
    }

    /* ▼ 再スタートボタンのスタイル */
    #restart-btn {
      display: none;
      margin: 15px auto;
      padding: 10px 25px;
      font-size: 20px;
      font-weight: bold;
      color: white;
      background-color: #8e24aa;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px #6a1b9a;
    }
    #restart-btn:hover { background-color: #ab47bc; }
    #restart-btn:active { transform: translateY(2px); box-shadow: 0 2px #6a1b9a; }
  </style>
</head>
<body onload="initGame()">

  <h1>⌨️ きごうの れんしゅう ⌨️</h1>

  <div class="info-box">
    <div class="score-area">
      のこり：<span id="timer">60</span>秒　
      できた数：<span id="currentScore">0</span>
    </div>
    
    <div class="warning-hint">
      ⚠️ <b>うてたら【Enter】を２回トントン！とおそう！</b><br>
      （１回目で「きまり」、２回目で「判定」だよ！）
    </div>

    <div id="message">きごうを うってから 【Enter】をおしてね！</div>
    
    <button id="restart-btn" onclick="initGame()">もういちど遊ぶっぴ！</button>

    <div id="quote-display"></div>
  </div>

  <div id="question-display">---</div>
  <br>
  <input type="text" id="input-area" onkeydown="handleKey(event)" autocomplete="off">

  <div class="guide" id="gameGuide">
    <strong>💡 シフトキーを つかおう！</strong><br><br>
    <table>
      <tr><td>「？」をうつとき：</td><td><span class="key-cap">Shift</span> ＋ <span class="key-cap">？</span></td></tr>
      <tr><td>「！」をうつとき：</td><td><span class="key-cap">Shift</span> ＋ <span class="key-cap">1</span></td></tr>
      <tr><td>「（ 」をうつとき：</td><td><span class="key-cap">Shift</span> ＋ <span class="key-cap">8</span></td></tr>
      <tr><td>「 ）」をうつとき：</td><td><span class="key-cap">Shift</span> ＋ <span class="key-cap">9</span></td></tr>
    </table>
  </div>

  <script>
    const ANIME_QUOTES = [
      "「あきらめたら そこでしあいしゅうりょうですよ…？」",
      "「わくわくっ！よくがんばったます！」",
      "「タイピング爆速界隈」",
      "「さーて，来週のタイピングさんはー？」",
      "「おみくじ：大吉！やったね！ラッキーカラーは青！」",
      "「全集中！その意気だ！」",
      "「逃げちゃダメだ…なんて思わなくていい！よくやった！」",
      "「記号王に おれはなる！」",
      "「癖になってんだ，記号打つの　家庭の事情でな」",
      "「おみくじ：中吉！おともだちにしんせつにするとラッキー！」",
      "「こんなに打てるなんて，オラわくわくすっぞ！」",
      "「９０秒で打ってみな」",
      "「おれは人間をやめるぞ，ジョジョ―ッ！」",
      "「凝（ギョウ）を使え！記号の位置が見えるはずだ！」",
      "「アリーヴェデルチ（さよならだ）」",
      "「おみくじ：吉！集中力アップ！宿題がはやくおわるかも」",
      "「記号タイピングとかないんか？」",
      "「とまるんじゃねぇぞ」",
      "「す。すごいね…ッ！」「ワ…ワァ…ッ！」",
      "「勝ったッ！「第３部」完！！」",
      "「打ったな！親父も打てた事ないのに！！」",
      "「記号の呼吸，壱ノ型！」",
      "「おみくじ：吉！先生のことばになやみのヒントがあるかも！」",
      "「見た目は子ども，タイピング力は大人！」",
      "「打てる…！私にも記号が打てるぞ……！」",
      "「高評価とタイピング、よろしくね！」",
      "「感謝の正拳突き…ならぬ、感謝のタイピング１万回！」",
      "(" + "おまえの次のセリフは『記号むずすぎ！』という！" + ")",
      "「おまえは今まで打ったキーの数を覚えているのか？」",
      "「CHU！打てすぎてごめん！」",
      "「覚悟はいいか？ おれはできてる」"
    ];

    const SYMBOLS = [
      { char: "？", name: "はてな" },
      { char: "！", name: "びっくり" },
      { char: "。", name: "まる" },
      { char: "、", name: "てん" },
      { char: "「", name: "かぎっこ・ひだり" },
      { char: "」", name: "かぎっこ・みぎ" },
      { char: "（", name: "かっこ・ひだり" },
      { char: "）", name: "かっこ・みぎ" },
      { char: "ー", name: "のばしぼう" }
    ];

    let score = 0;
    let timeLeft = 60;
    let currentTarget = "";
    let isPlaying = false;
    let timerID;
    let isChecking = false;

    const display = document.getElementById("question-display");
    const inputArea = document.getElementById("input-area");
    const quoteDisplay = document.getElementById("quote-display");
    const restartBtn = document.getElementById("restart-btn");

    function initGame() {
      score = 0;
      timeLeft = 60;
      isPlaying = false;
      isChecking = false;
      document.getElementById("currentScore").textContent = "0";
      document.getElementById("timer").textContent = "60";
      document.getElementById("message").textContent = "トントン！と２回 Enter をおすのがコツだよ！";
      quoteDisplay.style.display = "none";
      restartBtn.style.display = "none"; // ボタンを隠す
      inputArea.readOnly = false;
      inputArea.value = "";
      inputArea.focus(); // 解答欄にカーソルを合わせる
      nextQuestion();
    }

    function nextQuestion() {
      const item = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
      currentTarget = item.char;
      display.textContent = item.char;
      inputArea.value = "";
      inputArea.classList.remove("success");
      isChecking = false;
    }

    function handleKey(e) {
      if (timeLeft <= 0) return; // 終了後はここでは何もしない

      if (!isPlaying && e.key !== "Enter" && e.key !== "Process") {
        startTimer();
      }

      if (e.key === "Enter") {
        if (isChecking || inputArea.value === "") return;

        if (inputArea.value === currentTarget) {
          isChecking = true;
          score++;
          document.getElementById("currentScore").textContent = score;
          inputArea.classList.add("success");
          setTimeout(nextQuestion, 100);
        } else {
          inputArea.value = "";
        }
      }
    }

    // ▼ ★ここがポイント！ 画面のどこにいてもキー入力をキャッチするっぴ！
    window.addEventListener("keydown", (e) => {
      // ゲームが終わっていて、スペースキーが押されたらリスタート！
      if (timeLeft <= 0 && e.code === "Space") {
        initGame();
      }
    });

    function startTimer() {
      isPlaying = true;
      timerID = setInterval(() => {
        timeLeft--;
        document.getElementById("timer").textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timerID);
          isPlaying = false;
          inputArea.readOnly = true;
          display.textContent = "Time Up!";
          
          const randomQuote = ANIME_QUOTES[Math.floor(Math.random() * ANIME_QUOTES.length)];
          quoteDisplay.innerHTML = `<strong>★ キャラクターからのメッセージ ★</strong><br>${randomQuote}`;
          quoteDisplay.style.display = "block";
          restartBtn.style.display = "block"; // ボタンを表示する

          document.getElementById("message").innerHTML = 
            `<b>${score}こ できました！</b><br>もう一回やるなら <span class="key-cap" style="box-shadow:none;">スペース</span> をおすか、ボタンをクリックしてね！`;
        }
      }, 1000);
    }
  </script>
</body>
</html>
