<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>【ジョジョ5部修行】 キング・クリムゾンで裏切り者を始末せよ</title>
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
    <style>
        /* 5部らしいファッショナブルな色彩 */
        :root {
            --giorno-pink: #ff69b4;
            --bucci-gold: #ffd700;
            --diavolo-red: #ad1457;
            --bg-gradient: linear-gradient(135deg, #fff0f5 0%, #e1bee7 100%);
            --muda-color: rgba(255, 105, 180, 0.2);
        }

        body {
            background: var(--bg-gradient);
            color: #333;
            font-family: "MS UI Gothic", "UD Digi Kyokasho N-R", sans-serif;
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }

        /* ヘッダー：ジョルノの胸元のブローチをイメージした装飾 */
        #header-gui {
            position: fixed;
            top: 0; left: 0; width: 100%;
            background: var(--diavolo-red);
            color: white;
            text-align: center;
            z-index: 1000;
            border-bottom: 5px solid var(--bucci-gold);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        #story-box {
            background: #4a148c; /* 深いパープル */
            padding: 8px;
            font-size: 14px;
            font-weight: bold;
            color: var(--bucci-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #scroll-area {
            height: 100vh;
            overflow-y: scroll;
            scroll-behavior: auto;
            padding-top: 120px;
        }

        /* 冒頭：エピタフの「真実」 */
        #top-zone {
            height: 600px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            border: 10px double var(--giorno-pink);
            margin: 20px;
            border-radius: 50px 0 50px 0; /* 少し尖ったファッショナブルな形 */
            box-shadow: 10px 10px 0 var(--diavolo-red);
        }

        #color-orb {
            width: 160px; height: 160px;
            border-radius: 50%;
            border: 10px inset var(--bucci-gold);
            margin: 25px;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.8));
        }

        /* 文末：祭壇 */
        #bottom-zone {
            height: 700px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #212121; /* 暗転した真実 */
            color: #fff;
            border: 10px solid var(--bucci-gold);
            margin: 20px;
            border-radius: 0 50px 0 50px;
            box-shadow: -10px 10px 0 var(--giorno-pink);
        }

        /* 無駄無駄ラッシュの背景演出 */
        .muda-text {
            font-size: 60px;
            font-weight: 900;
            color: var(--muda-color);
            text-align: center;
            line-height: 1.0;
            font-style: italic;
            padding: 80px 0;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.05);
        }

        /* 操作パネル */
        .mission-hint {
            background: #fff;
            padding: 20px;
            border: 3px solid var(--diavolo-red);
            border-radius: 10px;
            font-weight: bold;
            color: #333;
            box-shadow: 5px 5px 0 var(--bucci-gold);
            line-height: 1.6;
        }

        kbd {
            background: var(--diavolo-red); color: #fff;
            padding: 4px 10px; border-radius: 4px;
            border-bottom: 3px solid #600;
        }

        /* ボタンのデザイン */
        .color-btn {
            width: 110px; height: 110px;
            border-radius: 50%; /* ブローチ風 */
            border: 4px solid var(--bucci-gold);
            cursor: pointer;
            transition: 0.1s;
        }
        .color-btn:hover { transform: scale(1.1); }

        /* エフェクト演出 */
        #flash-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none; justify-content: center; align-items: center;
            z-index: 2000; pointer-events: none;
        }
        .flash-text { 
            font-size: 80px; font-weight: 900; color: gold;
            text-shadow: 4px 4px 0 #000, -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000;
        }
    </style>
</head>
<body onload="initGame()">

    <div id="header-gui">
        <div id="story-box">
            JOJO: GOLDEN WIND -修行-
        </div>
        <h2 style="margin:5px 0; letter-spacing: 3px;">👑 帝王の予知(エピタフ)を完遂せよ 👑</h2>
    </div>

    <div id="flash-overlay">
        <div id="flash-msg" class="flash-text"></div>
    </div>

    <div id="scroll-area">
        <div id="top-zone">
            <h2 style="color:var(--diavolo-red);">【 予知される真実 】</h2>
            <div id="color-orb"></div>
            <div class="mission-hint">
                組織の裏切者は誰だッ<br>
                裏切者は『この色』のブローチをつけている……<br>
                ブローチを付けかえる前に<br>
                『裏切者の色のブローチボタン』を『押し』て始末せよッ！<br><br>
                <kbd>Ctrl</kbd> + <kbd>Fn</kbd> + <kbd>→</kbd> で<br>
                下の「護衛チームのアジト」へキングクリムゾンッ！
            </div>
        </div>

        <div id="muda-wrapper">
            <script>
                const mudaLines = ["無駄無駄無駄ァ！", "MUDA MUDA MUDA!", "WRYYYYYY!", "無駄ッ！"];
                for(let i=0; i<100; i++) {
                    const line = mudaLines[i % mudaLines.length];
                    document.write(`<div class="muda-text">${line}</div>`);
                }
            </script>
        </div>

        <div id="bottom-zone">
            <h2 style="color:var(--bucci-gold);">【 護衛チームのアジト 】</h2>
            <div style="display:flex; gap:20px; margin: 30px 0;">
                <button class="color-btn" style="background:#ff1493;" onclick="checkAnswer('#ff1493')"></button>
                <button class="color-btn" style="background:#ffd700;" onclick="checkAnswer('#ffd700')"></button>
                <button class="color-btn" style="background:#1e90ff;" onclick="checkAnswer('#1e90ff')"></button>
                <button class="color-btn" style="background:#32cd32;" onclick="checkAnswer('#32cd32')"></button>
            </div>
            <div class="mission-hint">
                正しいブローチを選択せよッ！<br><br>
                <kbd>Ctrl</kbd> + <kbd>Fn</kbd> + <kbd>←</kbd> で<br>
                上の「予知」へ戻るんだッ！
            </div>
        </div>
    </div>

    <script>
        const colorList = ['#ff1493', '#ffd700', '#1e90ff', '#32cd32'];
        let activeColor = "";
        const scrollArea = document.getElementById('scroll-area');
        const orb = document.getElementById('color-orb');
        const flash = document.getElementById('flash-overlay');
        const flashMsg = document.getElementById('flash-msg');

        function initGame() {
            setNewColor();
            setInterval(setNewColor, 5000); // 5秒で更新

            window.addEventListener('keydown', (e) => {
                const isHome = (e.key === 'Home' || e.keyCode === 36);
                const isEnd = (e.key === 'End' || e.keyCode === 35);

                if (e.ctrlKey && isHome) {
                    e.preventDefault();
                    scrollArea.scrollTop = 0;
                    playEffect("時は戻るッ！", "var(--giorno-pink)");
                }
                if (e.ctrlKey && isEnd) {
                    e.preventDefault();
                    scrollArea.scrollTop = scrollArea.scrollHeight;
                    playEffect("過程を消去！", "var(--bucci-gold)");
                }
            });
        }

        function setNewColor() {
            activeColor = colorList[Math.floor(Math.random() * colorList.length)];
            orb.style.backgroundColor = activeColor;
        }

        function checkAnswer(choice) {
            if (choice === activeColor) {
                playEffect("真実に到達！", "lime");
                setNewColor();
            } else {
                playEffect("無駄だッ！", "red");
            }
        }

        function playEffect(txt, col) {
            flashMsg.textContent = txt;
            flashMsg.style.color = col;
            flash.style.display = 'flex';
            flash.style.backgroundColor = 'rgba(0,0,0,0.5)';
            setTimeout(() => { flash.style.display = 'none'; }, 600);
        }
    </script>
</body>
</html>
